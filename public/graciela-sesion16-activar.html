<!doctype html>
<html lang="es">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Activar Sesión 16 · Graciela</title></head>
<body><div id="root"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import { collection, doc, getDoc, getDocs, getFirestore, serverTimestamp, setDoc } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
const NAVY="#0f243e", CORAL="#dd6d60", ADMIN="solsempp@gmail.com", TARGET="gracyromero3@gmail.com";
const firebaseConfig={apiKey:"AIzaSyDyLvINfBA1oqedb_yHNxq4LR7WBmLVZNc",authDomain:"entrenamiento-cerebral.firebaseapp.com",projectId:"entrenamiento-cerebral",storageBucket:"entrenamiento-cerebral.firebasestorage.app",messagingSenderId:"121258466683",appId:"1:121258466683:web:880ec318374158c1a771de",measurementId:"G-MLP3DKV4HG"};
const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app);
const week={label:"Semana 16 · Sesión en vivo: lectura y presión temporal",welcome:"Gracy, hoy haremos tres prácticas cortas para observar cómo cambia tu comprensión cuando aparece la presión del tiempo. No buscamos hacerlo rápido ni perfecto; queremos observar qué ocurre para entrenarlo mejor.",closing:"Terminaste las tres prácticas de hoy. Con estos resultados vamos a decidir qué necesita entrenarse después: lectura bajo presión, manejo del reloj, instrucciones complejas o respuesta escrita.",days:[{day:"Día 1",exercises:[{type:"timer",title:"Práctica 1 · Lectura y comprensión",instructions:"Abre la práctica y responde una pregunta a la vez. Lee completa antes de responder.",link:"/graciela-sesion16-rondaA.html",items:[]},{type:"timer",title:"Práctica 2 · Lectura con tiempo",instructions:"Haz esta práctica solo cuando Sol te lo indique. Verás un reloj global de 3 minutos. Lee completa antes de responder.",link:"/graciela-sesion16-rondaB.html",items:[]},{type:"timer",title:"Práctica 3 · Leer y escribir",instructions:"Haz esta práctica solo cuando Sol te lo indique. Lee cada consigna y escribe una respuesta breve. Verás un reloj global de 4 minutos.",link:"/graciela-sesion16-rondaC.html",items:[]}]},{day:"Día 2",exercises:[]},{day:"Día 3",exercises:[]},{day:"Día 4",exercises:[]},{day:"Día 5",exercises:[]},{day:"Día 6",exercises:[]},{day:"Día 7",exercises:[]}]};
const root=document.getElementById("root");
root.innerHTML=`<style>*{box-sizing:border-box}body{margin:0;background:#f7f4ef;color:#202733;font-family:Arial,sans-serif}.wrap{max-width:720px;margin:40px auto;padding:16px}.card{background:white;border-radius:18px;padding:24px;box-shadow:0 4px 18px rgba(0,0,0,.08)}h1{color:${NAVY}}button{border:0;border-radius:12px;padding:13px 18px;background:${CORAL};color:white;font-size:16px;cursor:pointer}button:disabled{opacity:.5}.status{margin-top:16px;padding:12px;border-radius:10px;background:#f2f3f5}</style><div class="wrap"><div class="card"><h1>Graciela · Sesión 16</h1><p>Esto añadirá la Semana 16 al perfil de Graciela y la dejará activa para la sesión de hoy.</p><button id="activate" disabled>Activar Semana 16</button><div id="status" class="status">Comprobando tu sesión de mentora…</div></div></div>`;
let targetId=null;
onAuthStateChanged(auth,async user=>{try{if(!user||user.email?.toLowerCase()!==ADMIN){document.getElementById("status").textContent="Entra primero a la app con tu cuenta de mentora y vuelve a abrir esta página.";return;}const snap=await getDocs(collection(db,"mentees"));const mentee=snap.docs.map(d=>({id:d.id,...d.data()})).find(m=>(m.email||"").toLowerCase()===TARGET);if(!mentee)throw new Error("No encontré a Graciela.");targetId=mentee.id;document.getElementById("activate").disabled=false;document.getElementById("status").textContent="Lista para activar. No modifica semanas anteriores.";}catch(e){console.error(e);document.getElementById("status").textContent="No pude preparar la activación.";}});
document.getElementById("activate").addEventListener("click",async()=>{const btn=document.getElementById("activate"),status=document.getElementById("status");try{btn.disabled=true;status.textContent="Activando…";const weeksRef=doc(db,"mentees",targetId,"data","weeks");const weeksSnap=await getDoc(weeksRef);const weeks=weeksSnap.exists()?[...(weeksSnap.data().weeks||[])]:[];if(weeks.length<15)throw new Error("El perfil todavía no tiene 15 semanas previas.");if(weeks.length===15)weeks.push(week);else weeks[15]=week;await setDoc(weeksRef,{weeks,updatedAt:serverTimestamp()});await setDoc(doc(db,"mentees",targetId,"data","activeWeek"),{activeWeek:15,updatedAt:serverTimestamp()});status.style.background="#eaf7f0";status.style.color="#196c4c";status.innerHTML="✓ Semana 16 activada para Graciela. Ya puede entrar a su app y verá las 3 prácticas de hoy.";}catch(e){console.error(e);status.style.background="#fbecec";status.style.color="#a23838";status.textContent="No se pudo activar: "+e.message;btn.disabled=false;}});
</script></body></html>
